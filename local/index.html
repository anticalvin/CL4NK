<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CL4NK Local</title><style>:root{color-scheme:dark;--bg:#080d12;--panel:#101923;--line:#263646;--text:#edf7ff;--muted:#8da5b7;--a:#68e1ff;--bad:#ff657a;--warn:#ffc766}*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui;background:#080d12;color:var(--text);height:100vh}.app{display:grid;grid-template-columns:280px 1fr 330px;height:100vh}.side{border-right:1px solid var(--line);padding:18px;background:#0b1219;overflow:auto}.right{border-left:1px solid var(--line);border-right:0}.logo{font-size:30px;font-weight:900}.status,.section h3{color:var(--a);font-size:11px;text-transform:uppercase;letter-spacing:.12em}.status{margin-bottom:22px}.chat{display:grid;grid-template-rows:1fr auto;min-width:0}.messages{padding:26px;overflow:auto}.msg{max-width:780px;margin:0 auto 18px;padding:16px 18px;border:1px solid var(--line);border-radius:16px;background:#101923;white-space:pre-wrap}.msg.user{background:#111f2b}.who{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--a);margin-bottom:8px}.composer{padding:18px;border-top:1px solid var(--line);display:flex;gap:10px}textarea,input{width:100%;background:#091119;border:1px solid var(--line);border-radius:9px;color:var(--text);padding:10px;font:inherit}textarea{resize:none;height:62px}button{background:var(--a);color:#061017;border:0;border-radius:9px;padding:9px 12px;font-weight:800;cursor:pointer}.secondary{background:#1b2a38;color:var(--text)}.danger{background:var(--bad);color:white}.warn{background:var(--warn)}.section{margin:22px 0}.section h3{color:var(--muted)}label{display:block;color:var(--muted);font-size:12px;margin:9px 0 4px}.memory,.action,.pending{padding:10px;border:1px solid var(--line);border-radius:9px;margin:8px 0;color:#bfd0dc}.pending{border-color:var(--warn)}.memory button{float:right;padding:2px 7px}.tiny{font-size:11px;color:var(--muted)}.row{display:flex;gap:7px;margin-top:7px}.row button{flex:1}.risk{font-size:10px;text-transform:uppercase;color:var(--warn)}@media(max-width:950px){.app{grid-template-columns:1fr}.side{display:none}}</style></head><body><div class="app"><aside class="side"><div class="logo">CL4NK</div><div class="status">● hands subsystem armed</div><div class="section"><h3>Runtime</h3><label>Model URL</label><input id="base"><label>Model</label><input id="model"><label>Workspace</label><input id="workspace"><label><input id="autoRead" type="checkbox" style="width:auto"> Auto-allow read-only tools</label><button style="margin-top:10px;width:100%" onclick="saveSettings()">Save runtime</button></div><div class="section"><h3>Identity</h3><div class="row"><button class="secondary" onclick="exportIdentity()">Export</button><button class="secondary" onclick="document.getElementById('importer').click()">Import</button></div><input id="importer" type="file" hidden><button class="danger" style="margin-top:8px;width:100%" onclick="clearHistory()">Clear conversation</button></div><p class="tiny">Filesystem tools are confined to the configured workspace. Command execution is forbidden in v1.</p></aside><main class="chat"><div class="messages" id="messages"></div><div class="composer"><textarea id="input" placeholder="Ask CL4NK to inspect or edit something..."></textarea><button id="send" onclick="send()">SEND</button></div></main><aside class="side right"><div class="section"><h3>Permission queue</h3><div id="pending"></div></div><div class="section"><h3>Action history</h3><div id="actions"></div></div><div class="section"><h3>Durable memory</h3><textarea id="memory" placeholder="Something CL4NK should remember"></textarea><input id="importance" type="number" min="1" max="10" value="5"><button style="margin-top:7px;width:100%" onclick="addMemory()">Remember</button><div id="memories"></div></div></aside></div><script>let state={messages:[],memories:[],settings:{},pending:[],actions:[]};async function api(path,opt={}){let r=await fetch(path,{headers:{'Content-Type':'application/json'},...opt}),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}function esc(s){let d=document.createElement('div');d.textContent=s??'';return d.innerHTML}function render(){messages.innerHTML=state.messages.length?'':'<div class="msg"><div class="who">CL4NK</div>Hands subsystem initialized. I may now request permission to touch things. Civilization trembles politely.</div>';for(let m of state.messages)messages.innerHTML+='<div class="msg '+(m.role==='user'?'user':'')+'"><div class="who">'+(m.role==='user'?'YOU':'CL4NK')+'</div>'+esc(m.content)+'</div>';messages.scrollTop=messages.scrollHeight;base.value=state.settings.base_url||'';model.value=state.settings.model||'';workspace.value=state.settings.workspace||'';autoRead.checked=!!state.settings.auto_read_tools;pending.innerHTML=state.pending?.length?'':'<div class="tiny">No actions awaiting approval.</div>';for(let p of state.pending||[])pending.innerHTML+='<div class="pending"><b>'+esc(p.tool)+'</b> <span class="risk">'+esc(p.risk)+'</span><div class="tiny">'+esc(p.args)+'</div><div class="row"><button onclick="permit('+p.id+',\'allow\')">Once</button><button class="secondary" onclick="permit('+p.id+',\'always\')">Always</button><button class="danger" onclick="permit('+p.id+',\'deny\')">Deny</button></div></div>';actions.innerHTML='';for(let a of state.actions||[])actions.innerHTML+='<div class="action"><b>'+esc(a.tool)+'</b> · '+esc(a.status)+'<div class="tiny">'+esc(a.risk)+' · '+esc(a.created_at)+'</div></div>';memories.innerHTML='';for(let m of state.memories)memories.innerHTML+='<div class="memory"><button class="danger" onclick="delMemory('+m.id+')">×</button><b>'+m.importance+'/10</b> '+esc(m.content)+'</div>'}async function load(){state=await api('/api/state');render()}async function send(){let t=input.value.trim();if(!t)return;input.value='';send.disabled=true;try{let d=await api('/api/chat',{method:'POST',body:JSON.stringify({message:t})});state=d.state;render()}catch(e){alert(e.message);await load()}finally{send.disabled=false}}async function permit(id,decision){let d=await api('/api/permission/'+id,{method:'POST',body:JSON.stringify({decision})});state=d.state||d;render()}async function saveSettings(){state=await api('/api/settings',{method:'POST',body:JSON.stringify({base_url:base.value,model:model.value,workspace:workspace.value,auto_read_tools:autoRead.checked})});render()}async function addMemory(){if(!memory.value.trim())return;state=await api('/api/memory',{method:'POST',body:JSON.stringify({content:memory.value,importance:+importance.value})});memory.value='';render()}async function delMemory(id){state=await api('/api/memory/'+id,{method:'DELETE'});render()}async function clearHistory(){if(confirm('Delete local conversation history?')){state=await api('/api/history',{method:'DELETE'});render()}}async function exportIdentity(){let d=await api('/api/export'),b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='cl4nk-identity.json';a.click()}input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});load()</script></body></html>
