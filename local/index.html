<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CL4NK Local</title><style>:root{color-scheme:dark;--bg:#080d12;--panel:#101923;--line:#263646;--text:#edf7ff;--muted:#8da5b7;--a:#68e1ff;--bad:#ff657a}*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui;background:radial-gradient(circle at top,#172638,#080d12 55%);color:var(--text);height:100vh}.app{display:grid;grid-template-columns:260px 1fr 300px;height:100vh}.side{border-right:1px solid var(--line);padding:20px;background:#0b1219}.right{border-left:1px solid var(--line);border-right:0}.logo{font-size:30px;font-weight:900;letter-spacing:-.05em}.status{color:var(--a);font-size:12px;text-transform:uppercase;letter-spacing:.12em;margin-bottom:26px}.chat{display:grid;grid-template-rows:1fr auto;min-width:0}.messages{padding:26px;overflow:auto}.msg{max-width:780px;margin:0 auto 18px;padding:16px 18px;border:1px solid var(--line);border-radius:16px;background:rgba(16,25,35,.8);white-space:pre-wrap}.msg.user{background:#111f2b}.who{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--a);margin-bottom:8px}.composer{padding:18px;border-top:1px solid var(--line);display:flex;gap:10px}textarea,input{width:100%;background:#091119;border:1px solid var(--line);border-radius:10px;color:var(--text);padding:11px;font:inherit}textarea{resize:none;height:62px}button{background:var(--a);color:#061017;border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.secondary{background:#1b2a38;color:var(--text)}.danger{background:var(--bad);color:white}.section{margin:24px 0}.section h3{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}label{display:block;color:var(--muted);font-size:12px;margin:10px 0 5px}.memory{padding:10px;border:1px solid var(--line);border-radius:10px;margin:8px 0;color:#bfd0dc}.memory button{float:right;padding:2px 7px}.tiny{font-size:12px;color:var(--muted)}.row{display:flex;gap:8px;margin-top:8px}.row button{flex:1}@media(max-width:900px){.app{grid-template-columns:1fr}.side{display:none}}</style></head><body><div class="app"><aside class="side"><div class="logo">CL4NK</div><div class="status">● local chassis online</div><div class="section"><h3>Runtime</h3><label>OpenAI-compatible URL</label><input id="base"><label>Model</label><input id="model"><label>API key (optional)</label><input id="key" type="password"><button style="margin-top:10px;width:100%" onclick="saveSettings()">Save runtime</button></div><div class="section"><h3>Identity</h3><div class="row"><button class="secondary" onclick="exportIdentity()">Export</button><button class="secondary" onclick="document.getElementById('importer').click()">Import</button></div><input id="importer" type="file" accept="application/json" hidden onchange="importIdentity(this.files[0])"><button class="danger" style="margin-top:8px;width:100%" onclick="clearHistory()">Clear conversation</button></div><p class="tiny">Data stays in <code>local/cl4nk.db</code>. CL4NK only contacts the model server you configure.</p></aside><main class="chat"><div class="messages" id="messages"></div><div class="composer"><textarea id="input" placeholder="Give the robot a problem..."></textarea><button id="send" onclick="send()">SEND</button></div></main><aside class="side right"><div class="section"><h3>Durable memory</h3><textarea id="memory" placeholder="Something CL4NK should remember"></textarea><label>Importance 1–10</label><input id="importance" type="number" min="1" max="10" value="5"><button style="margin-top:8px;width:100%" onclick="addMemory()">Remember</button><div id="memories"></div></div></aside></div><script>let state={messages:[],memories:[],settings:{}};async function api(path,opt={}){let r=await fetch(path,{headers:{'Content-Type':'application/json'},...opt});let d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}function render(){let box=document.getElementById('messages');box.innerHTML=state.messages.length?'':'<div class="msg"><div class="who">CL4NK</div>Local chassis initialized. Connect an Ollama or other OpenAI-compatible server, then say something. I have prepared several opinions.</div>';for(let m of state.messages){let e=document.createElement('div');e.className='msg '+(m.role==='user'?'user':'');e.innerHTML='<div class="who">'+(m.role==='user'?'YOU':'CL4NK')+'</div>'+escapeHtml(m.content);box.appendChild(e)}box.scrollTop=box.scrollHeight;document.getElementById('base').value=state.settings.base_url||'';document.getElementById('model').value=state.settings.model||'';let mm=document.getElementById('memories');mm.innerHTML='';for(let m of state.memories){let e=document.createElement('div');e.className='memory';e.innerHTML='<button class="danger" onclick="delMemory('+m.id+')">×</button><b>'+m.importance+'/10</b> '+escapeHtml(m.content);mm.appendChild(e)}}function escapeHtml(s){let d=document.createElement('div');d.textContent=s;return d.innerHTML.replaceAll('\n','<br>')}async function load(){state=await api('/api/state');render()}async function send(){let i=document.getElementById('input'),t=i.value.trim();if(!t)return;i.value='';let b=document.getElementById('send');b.disabled=true;b.textContent='THINKING';state.messages.push({role:'user',content:t});render();try{let d=await api('/api/chat',{method:'POST',body:JSON.stringify({message:t})});state=d.state;render()}catch(e){alert(e.message);await load()}finally{b.disabled=false;b.textContent='SEND'}}async function saveSettings(){state=await api('/api/settings',{method:'POST',body:JSON.stringify({base_url:base.value,model:model.value,api_key:key.value})});key.value='';render()}async function addMemory(){let t=memory.value.trim();if(!t)return;state=await api('/api/memory',{method:'POST',body:JSON.stringify({content:t,importance:+importance.value})});memory.value='';render()}async function delMemory(id){state=await api('/api/memory/'+id,{method:'DELETE'});render()}async function clearHistory(){if(confirm('Delete local conversation history?')){state=await api('/api/history',{method:'DELETE'});render()}}async function exportIdentity(){let d=await api('/api/export'),blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cl4nk-identity.json';a.click();URL.revokeObjectURL(a.href)}async function importIdentity(f){if(!f)return;let d=JSON.parse(await f.text());state=await api('/api/import',{method:'POST',body:JSON.stringify(d)});render()}input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});load()</script></body></html>
